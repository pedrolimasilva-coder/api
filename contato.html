<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neymar Jr - Contato</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="carreira.html">Carreira</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contato</h1>
        <p>Envie uma mensagem sobre o site do Neymar Jr.</p>

        <form id="formContato">
            <label for="nome">Nome:</label><br>
            <input id="nome" name="nome" type="text" required maxlength="100"><br><br>

            <label for="email">E-mail:</label><br>
            <input id="email" name="email" type="email" required maxlength="150"><br><br>

            <label for="mensagem">Mensagem:</label><br>
            <textarea id="mensagem" name="mensagem" rows="5" required></textarea><br><br>

            <button type="submit">Enviar mensagem</button>
        </form>

        <p id="statusContato" role="status"></p>

        <h2>Mensagens enviadas</h2>
        <ul id="listaMensagens"></ul>
    </main>

    <footer>
        <p>&copy; 2026 Site do Neymar. Todos os direitos reservados.</p>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
